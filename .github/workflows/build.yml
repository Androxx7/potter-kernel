name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev \
            gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu \
            device-tree-compiler zip
      - name: source
        run: |
          git clone --depth 1 -b lineage-17.1 \
            https://github.com/LineageOS/android_kernel_motorola_msm8953.git ksrc
      - name: patches
        run: |
          cd ksrc
          for p in ../patches/*.patch; do
            [ -e "$p" ] || continue
            echo "== $p"
            patch -p1 --no-backup-if-mismatch < "$p" || exit 1
          done
      - name: build
        run: |
          set -euo pipefail
          cd ksrc
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          make O=out potter_defconfig
          make O=out -j"$(nproc)" Image.gz-dtb 2>&1 | tail -60
          ls -la out/arch/arm64/boot/
      - name: artifact
        run: |
          mkdir -p artifacts
          cp ksrc/out/arch/arm64/boot/Image.gz-dtb artifacts/ 2>/dev/null || true
          cp ksrc/out/arch/arm64/boot/Image.gz  artifacts/ 2>/dev/null || true
          cp ksrc/out/arch/arm64/boot/Image     artifacts/ 2>/dev/null || true
          ls -la artifacts; md5sum artifacts/* || true
      - uses: actions/upload-artifact@v4
        with:
          name: potter-kernel
          path: artifacts/*
          if-no-files-found: error
