name: build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
      - name: source
        run: |
          git clone --depth 1 -b lineage-17.1 \
            https://github.com/LineageOS/android_kernel_motorola_msm8953.git ksrc
      - name: patches
        run: |
          cd ksrc
          python3 "$GITHUB_WORKSPACE/scripts/patch.py"
      - name: build
        run: |
          set -euo pipefail
          cd ksrc
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export HOSTCFLAGS="-fcommon -w"
          make O=out potter_defconfig
          make O=out -j"$(nproc)" Image.gz-dtb
          ls -la out/arch/arm64/boot/
      - uses: actions/upload-artifact@v4
        with:
          name: potter-Image
          path: ksrc/out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error
