name: potter-kernel
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            bc bison flex libssl-dev libelf-dev rsync

      - name: source
        run: |
          set -e
          BR=lineage-17.1
          git clone --depth 1 -b $BR https://github.com/LineageOS/android_kernel_motorola_msm8953.git ksrc
          ls ksrc/arch/arm64/configs/ | head -30
          test -f ksrc/arch/arm64/configs/potter_defconfig || { echo "SEM potter_defconfig"; exit 1; }

      - name: patches
        run: |
          set -e
          if [ -d patches ] && ls patches/*.patch >/dev/null 2>&1; then
            for p in patches/*.patch; do
              echo "== $p"; patch -p1 -d ksrc < "$p" || exit 1
            done
          else
            echo "nenhum patch"
          fi

      - name: build
        run: |
          set -euo pipefail
          sudo ln -sf "$(which aarch64-linux-gnu-gcc-11)" /usr/bin/aarch64-linux-gnu-gcc || true
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export HOSTCFLAGS="-fcommon -w"
          export KBUILD_BUILD_USER=token
          export KBUILD_BUILD_HOST=potter
          grep -q fcommon ksrc/scripts/dtc/Makefile || \
            sed -i 's/^HOSTCFLAGS_dtc-lexer.*/&\nHOSTCFLAGS_dtc-lexer.o += -fcommon/' ksrc/scripts/dtc/Makefile
          cd ksrc
          make potter_defconfig
          make -j"$(nproc)" Image.gz-dtb 2>&1 | tail -60
          test -f arch/arm64/boot/Image.gz-dtb
          ls -la arch/arm64/boot/

      - name: artifact
        run: |
          set -e
          mkdir -p out
          cp ksrc/arch/arm64/boot/Image.gz-dtb out/
          md5sum out/*

      - uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb
          path: out/*
          if-no-files-found: error
